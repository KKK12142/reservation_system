<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>부여여고 박람회 — 실시간 상담 현황</title>
<base target="_top">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  /* 전자칠판 시인성: 진한 배경 + 굵은 글씨 + 큰 글자 */
  .booth-card { transition: background-color 0.3s ease, box-shadow 0.3s ease; }
  @keyframes pulseAmber {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
    50% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
  }
  .calling-pulse { animation: pulseAmber 1.4s ease-in-out infinite; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

<div class="max-w-[1920px] mx-auto p-5">

  <!-- 헤더 -->
  <header class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700">
    <div>
      <div class="text-sm text-slate-400 tracking-widest">BUYEO GIRLS' HIGH SCHOOL · 2026</div>
      <div class="flex items-baseline gap-3 mt-0.5">
        <div class="text-2xl md:text-3xl font-bold">교육과정 박람회 · 실시간 상담 현황</div>
        <div id="grade-badge" class="hidden px-3 py-0.5 rounded-md text-lg md:text-xl font-bold bg-indigo-500 text-white"></div>
      </div>
    </div>
    <div class="text-right">
      <div id="block-badge" class="inline-block px-4 py-1.5 rounded-full text-base md:text-lg font-bold bg-slate-700">
        로딩 중...
      </div>
      <div id="clock" class="text-3xl md:text-4xl font-mono font-bold mt-1 text-slate-100">--:--:--</div>
    </div>
  </header>

  <!-- 부스 그리드 -->
  <main id="board" class="space-y-6">
    <div id="board-empty" class="text-center text-slate-500 py-20 text-xl hidden">활성 부스가 없습니다</div>
  </main>

  <!-- 푸터 -->
  <footer class="mt-6 pt-4 border-t border-slate-700 flex items-center justify-between text-xs text-slate-500">
    <div>본인 차례가 임박하면 해당 부스로 이동하여 학생 폰의 QR을 보여주세요</div>
    <div>마지막 갱신 <span id="last-update">--</span></div>
  </footer>
</div>

<!-- 연결 끊김 안내 (오류 누적 시 노출) -->
<div id="error-banner" class="hidden fixed top-3 left-1/2 -translate-x-1/2 bg-red-600 text-white text-sm px-4 py-2 rounded-lg shadow z-50">
  서버 연결이 일시적으로 불안정합니다 — 자동 재시도 중
</div>

<script>
const POLL_MS = 5000;
const FILTER_GRADE = '<?= grade ?>'; // URL ?grade=1|2 — 비어있으면 전체
const state = {
  pollTimer: null,
  clockTimer: null,
  lastV: '',
  errorStreak: 0
};

// 헤더 학년 배지 초기 세팅
(function setGradeBadge() {
  if (FILTER_GRADE === '1' || FILTER_GRADE === '2') {
    const el = document.getElementById('grade-badge');
    if (el) {
      el.textContent = FILTER_GRADE + '학년 전용';
      el.classList.remove('hidden');
    }
  }
})();

// ===== API =====
function callApi(action, params) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('서버 미연결'));
      return;
    }
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(new Error(err && err.message || String(err))))
      .api(action, params || {});
  });
}

// ===== 시계 =====
function startClock() {
  const update = () => {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
  };
  update();
  state.clockTimer = setInterval(update, 1000);
}

// ===== 폴링 =====
function startPoll() {
  stopPoll();
  state.pollTimer = setInterval(refreshDashboard, POLL_MS);
}
function stopPoll() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

async function refreshDashboard() {
  try {
    const result = await callApi('getDashboard', { last_v: state.lastV });
    state.errorStreak = 0;
    document.getElementById('error-banner').classList.add('hidden');
    document.getElementById('last-update').textContent = formatTime(new Date());
    if (result && result.unchanged) return;
    state.lastV = result._v || '';
    renderBlockBadge(result.current_block);
    renderBoard(result.booths || []);
  } catch (err) {
    state.errorStreak++;
    if (state.errorStreak >= 3) {
      document.getElementById('error-banner').classList.remove('hidden');
    }
  }
}

function formatTime(d) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ===== 헤더 블록 배지 =====
function renderBlockBadge(block) {
  const el = document.getElementById('block-badge');
  if (block === 0) {
    el.textContent = '사전예약 기간';
    el.className = 'inline-block px-4 py-1.5 rounded-full text-base md:text-lg font-bold bg-indigo-600 text-white';
  } else if (block >= 7) {
    el.textContent = '박람회 종료';
    el.className = 'inline-block px-4 py-1.5 rounded-full text-base md:text-lg font-bold bg-slate-600 text-white';
  } else {
    el.textContent = `${block}블록 진행 중`;
    el.className = 'inline-block px-4 py-1.5 rounded-full text-base md:text-lg font-bold bg-emerald-600 text-white';
  }
}

// ===== 보드 렌더링 =====
function renderBoard(booths) {
  const board = document.getElementById('board');
  const empty = document.getElementById('board-empty');
  Array.from(board.children).forEach(c => { if (c !== empty) c.remove(); });

  // URL ?grade= 필터
  let filtered = booths;
  if (FILTER_GRADE === '1' || FILTER_GRADE === '2') {
    const g = Number(FILTER_GRADE);
    filtered = booths.filter(b => Number(b.target_grade) === g);
  }

  if (!filtered.length) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  // 공간별 그룹 (학년 필터 적용 후 한 공간만 남는 경우가 보통)
  const grouped = { A: [], B: [], C: [] };
  filtered.forEach(b => { if (grouped[b.space]) grouped[b.space].push(b); });
  Object.keys(grouped).forEach(space => {
    grouped[space].sort((a, b) => Number(a.target_grade) - Number(b.target_grade));
  });

  ['A', 'B', 'C'].forEach(space => {
    const items = grouped[space];
    if (!items || items.length === 0) return;

    const section = document.createElement('section');
    const header = document.createElement('div');
    header.className = 'flex items-baseline gap-3 mb-3';
    header.innerHTML = `
      <div class="text-xl md:text-2xl font-bold text-slate-200">공간 ${space}</div>
      <div class="text-sm text-slate-400">${space === 'C' ? '학생 멘토 부스' : '교과 상담'} · ${items.length}개 부스</div>
    `;
    section.appendChild(header);

    const grid = document.createElement('div');
    // auto-rows-fr: 같은 행 카드 높이 자동 통일. 한 행에 3개 카드.
    grid.className = 'grid gap-3 grid-cols-1 md:grid-cols-2 lg:grid-cols-3 auto-rows-fr';
    items.forEach(b => grid.appendChild(renderCard(b)));
    section.appendChild(grid);
    board.appendChild(section);
  });
}

function renderCard(b) {
  const grade = Number(b.target_grade);
  const gradeLabel = grade === 0 ? '전체' : grade + '학년';

  let stateClass, stateLabel, stateBg, primaryName, primaryClass, primaryNote;
  if (b.current) {
    stateClass = 'state-progress';
    stateLabel = '🟢 상담 중';
    stateBg = 'bg-emerald-900/40 border-emerald-500';
    primaryName = b.current.name;
    primaryClass = b.current.grade_class;
    primaryNote = '';
  } else if (b.calling) {
    stateClass = 'state-calling calling-pulse';
    stateLabel = '🔔 호출됨';
    stateBg = 'bg-amber-500/30 border-amber-400';
    primaryName = b.calling.name;
    primaryClass = b.calling.grade_class;
    primaryNote = '즉시 부스로 이동';
  } else {
    stateClass = 'state-idle';
    stateLabel = '대기 중';
    stateBg = 'bg-slate-800 border-slate-700';
    primaryName = '─';
    primaryClass = '';
    primaryNote = '';
  }

  const card = document.createElement('div');
  card.className = `booth-card ${stateClass} rounded-2xl border-2 ${stateBg} p-4 flex flex-col h-full`;

  const headerHtml = `
    <div class="flex items-center justify-between mb-2 pb-2 border-b border-white/10">
      <div>
        <div class="text-xl md:text-2xl font-bold leading-tight">${b.subject_group}</div>
        <div class="text-xs md:text-sm text-slate-400">${gradeLabel} · ${b.room || b.booth_id}</div>
      </div>
      <div class="text-xs md:text-sm font-semibold whitespace-nowrap">${stateLabel}</div>
    </div>
  `;

  // 본문(현재/호출 학생) — 고정 높이 영역
  let bodyHtml = '';
  if (b.current || b.calling) {
    bodyHtml = `
      <div class="min-h-[80px]">
        <div class="text-2xl md:text-3xl font-bold mb-0.5 leading-tight">${primaryName}</div>
        <div class="text-sm md:text-base text-slate-300">${primaryClass}</div>
        ${primaryNote ? `<div class="text-xs md:text-sm font-semibold text-amber-300 mt-1">${primaryNote}</div>` : ''}
      </div>
    `;
  } else {
    bodyHtml = `<div class="min-h-[80px] flex items-center"><div class="text-2xl md:text-3xl text-slate-500 font-bold">대기 없음</div></div>`;
  }

  // 다음 호출 예정 — 항상 6슬롯, 2열 × 3행
  const nextItems = b.next || [];
  const slotsHtml = [];
  for (let i = 0; i < 6; i++) {
    const n = nextItems[i];
    if (n) {
      slotsHtml.push(`
        <div class="flex items-center justify-between gap-2 px-2 py-1 rounded ${n.type === 'reserved' ? 'bg-indigo-900/30' : 'bg-emerald-900/30'}">
          <div class="min-w-0 flex-1">
            <div class="text-base md:text-lg font-semibold truncate leading-tight">${n.name}</div>
            <div class="text-xs text-slate-400 leading-tight">${n.grade_class}</div>
          </div>
          <div class="text-xs ${n.type === 'reserved' ? 'text-indigo-300' : 'text-emerald-300'} flex-shrink-0 font-semibold">${n.type === 'reserved' ? '사전' : '당일'}</div>
        </div>
      `);
    } else {
      slotsHtml.push(`<div class="px-2 py-1 rounded bg-slate-800/50"><div class="text-base md:text-lg text-slate-600">─</div></div>`);
    }
  }
  const nextHtml = `
    <div class="mt-3 pt-3 border-t border-white/10">
      <div class="text-xs text-slate-400 mb-2">다음 호출 예정 (최대 6명)</div>
      <div class="grid grid-cols-2 gap-x-2 gap-y-1.5">
        ${slotsHtml.join('')}
      </div>
    </div>
  `;

  // 하단 — 전체 대기 인원수 강조
  const waitingClass = b.waiting_count >= 5 ? 'text-red-400'
                      : b.waiting_count >= 3 ? 'text-amber-300'
                      : 'text-emerald-300';
  const footHtml = `
    <div class="mt-auto pt-3 border-t border-white/10 flex items-baseline justify-between">
      <div class="text-xs text-slate-400 uppercase tracking-wider">전체 대기</div>
      <div class="flex items-baseline gap-1">
        <div class="text-4xl md:text-5xl font-extrabold ${waitingClass} leading-none">${b.waiting_count}</div>
        <div class="text-base text-slate-300">명</div>
      </div>
    </div>
  `;

  card.innerHTML = headerHtml + bodyHtml + nextHtml + footHtml;
  return card;
}

// ===== 초기화 =====
document.addEventListener('DOMContentLoaded', () => {
  startClock();
  refreshDashboard();
  startPoll();

  // 백그라운드면 폴링 정지(전자칠판 모니터 절약)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopPoll();
    else { refreshDashboard(); startPoll(); }
  });
});
</script>
</body>
</html>
